name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Configure Firebase
        run: |
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          old = 'id("org.jetbrains.kotlin.android") version "2.4.0" apply false'
          new = old + '\nid("com.google.gms.google-services") version "4.5.0" apply false'

          if 'com.google.gms.google-services' not in text:
              text = text.replace(old, new)

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          old = 'id("dev.flutter.flutter-gradle-plugin")'
          new = old + '\nid("com.google.gms.google-services")'

          if 'com.google.gms.google-services' not in text:
              text = text.replace(old, new)

          app.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ajanta-saree-centre-apk
          path: build/app/outputs/flutter-apk/app-release.apk
